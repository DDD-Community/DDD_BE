name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint:check

      - name: Unit test
        run: yarn test --runInBand --passWithNoTests

      # deploy.yml 의 GCP 키 게이트는 배포에서만 실행되므로 유닛 테스트가 닿지 않는다.
      # 분기를 잘못 뭉쳐 실제로 뚫린 적이 있어 여기서 기계적으로 확인한다.
      - name: Deploy key gate test
        run: sh scripts/test-deploy-key-gate.sh

      - name: Build
        run: yarn build

      - name: Set image name
        id: image
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "tag=ghcr.io/${OWNER,,}/ddd-be:ci" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${OWNER,,}/ddd-be:latest" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build check
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.image.outputs.latest }}
