# 컨테이너 stdout 로그는 기본값이 무제한이라 디스크를 조용히 채운다.
# 2026-08 장애에서 postgres 크래시 루프 로그만 312MB 까지 자랐다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  app:
    image: ${APP_IMAGE:-ddd-be:local}
    container_name: ddd-be-app
    logging: *default-logging
    env_file:
      - ${APP_ENV_FILE:-.env.development}
    environment:
      DB_HOST: postgres
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./gcp-key.json:/app/gcp-key.json:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ddd-be-postgres
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: ddd-be-caddy
    logging: *default-logging
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /opt/admin/frontend:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
